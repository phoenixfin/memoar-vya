<script src="page-flip.js"></script>
<script>
const N=110;
const el=document.getElementById('book');
const pf=new St.PageFlip(el,{width:420,height:596,size:'stretch',minWidth:280,maxWidth:560,minHeight:400,maxHeight:800,showCover:true,maxShadowOpacity:.5,mobileScrollSupport:false,usePortrait:true,flippingTime:700});
pf.loadFromHTML(document.querySelectorAll('.pg'));
const cnt=document.getElementById('cnt');
function upd(){const i=pf.getCurrentPageIndex()+1;cnt.textContent=i+' / '+N}
pf.on('flip',upd);
const $=id=>document.getElementById(id);
$('prev').onclick=$('p2').onclick=()=>pf.flipPrev();
$('next').onclick=$('n2').onclick=()=>pf.flipNext();
$('first').onclick=()=>pf.flip(0);
$('go').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=Math.min(N,Math.max(1,+e.target.value||1));pf.flip(v-1);e.target.blur()}});
$('full').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')pf.flipNext();if(e.key==='ArrowLeft')pf.flipPrev()});
</script>
